# `git.ptcookie.net` is the origin; GitHub is a mirror that git-server's own
# post-receive hook force-pushes to. Three consequences shape this file:
#
#   * Nothing here may write to the repository. A commit pushed by a workflow
#     is erased by the next mirror push, so CI only ever checks.
#   * `push` is scoped to `main` because pull request branches live in this
#     same repository (Dependabot's do), so an unscoped `push` trigger would
#     run every PR twice.
#   * A force-pushed rewrite makes an in-flight run meaningless, hence the
#     concurrency cancel.
#
# There is no test suite and no linter in this repository: the image *is* the
# artifact, so the only meaningful check is that it still builds and that a
# container started from it still behaves. `scripts/smoke-test.sh` is that
# check — it drives every git-shell command over SSH, including the rejection
# cases (see AGENTS.md, "Testing changes").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Both architectures, each built natively — `ubuntu-latest` for amd64 and
  # `ubuntu-24.04-arm` for arm64 — so no QEMU is involved. The build is an
  # `apk add` and a handful of COPYs, so running the whole smoke test twice
  # costs a couple of minutes and catches an arch-specific break before a tag
  # is pushed rather than after.
  image:
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      # `Dockerfile` is a symlink to `Containerfile`; naming the real file
      # keeps this working regardless of how the symlink is checked out.
      # `load: true` puts the result in the local daemon, which is where
      # `docker run` in the smoke test looks for it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: ${{ matrix.platform }}
          tags: git-server:ci
          push: false
          load: true
          cache-from: type=gha,scope=ci-${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=ci-${{ env.PLATFORM_SLUG }}
      - name: Smoke test
        env:
          IMAGE: git-server:ci
        run: ./scripts/smoke-test.sh
